---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      docker-deps:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      pre-commit-deps:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      # [dependency-groups] dev; auto-merged
      package-dev-deps:
        dependency-type: "development"
        patterns:
          - "*"
      # [project] dependencies; reviewed by hand
      package-deps:
        dependency-type: "production"
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.github/osv-scanner"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
