[project]
name = "crap2feed"
version = "0.1.0"
description = "Since many companies and organisations don't think that RSS/Atom is needed for blogs this tool was generated by Claude."
authors = [{ name = "Peter Reuterås", email = "peter@reuteras.net" }]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
]
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.scripts]
crap2feed = "crap2feed:main"

[project.urls]
"Homepage" = "https://github.com/reuteras/crap2feed"
"Bug Tracker" = "https://github.com/reuteras/crap2feed/issues"
"Repository" = "https://github.com/reuteras/crap2feed.git"
"Documentation" = "https://github.com/reuteras/crap2feed#readme"

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["crap2feed"]

[dependency-groups]
dev = ["mypy>=2.3.0", "pytest>=8.4.2", "ruff>=0.16.1"]

[tool.ruff]
target-version = "py311"
lint.select = [
    "PL",  # Pylint
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "D",   # pydocstyle
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # Ruff-specific
]
lint.ignore = [
    "E501", # line too long, handled by black
]
fix = true

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"

# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false

# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"

# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false

# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
extra_checks = true

# Start with these disabled, enable gradually
disallow_any_generics = false
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = "bs4.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "requests.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
